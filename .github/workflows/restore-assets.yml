name: Restore binary assets
# The site is pushed as text only; images arrive as *.b64 files. This job turns them back
# into real PNG/JPG files on main so GitHub Pages serves normal images.
# Runs are queued one at a time, and the push rebases onto main and retries, so several quick
# pushes in a row no longer fail with "rejected (fetch first)".
on:
  push:
    branches: [main]
    paths: ['**/*.b64']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: restore-binary-assets
  cancel-in-progress: false
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Decode .b64 files and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            find . -name '*.b64' -not -path './.git/*' | while read -r f; do
              base64 -d "$f" > "${f%.b64}"
              rm "$f"
            done
            git add -A
            if git diff --cached --quiet; then echo "Nothing to restore."; exit 0; fi
            git commit -m "Restore binary assets"
            if git push origin HEAD:main; then exit 0; fi
            echo "Push rejected (main moved). Retrying in $((attempt*5))s..."
            sleep $((attempt*5))
          done
          echo "Could not push after 5 attempts"; exit 1
