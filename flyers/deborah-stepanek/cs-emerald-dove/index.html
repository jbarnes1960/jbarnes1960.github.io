<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>1027 Emerald Dove Avenue, College Station TX — Listing Flyer</title>
  <meta name="description" content="Portrait and square listing flyers for 1027 Emerald Dove Avenue, College Station TX." />
  <style>
    :root {
      --navy: #0f2a43;
      --navy-2: #17496b;
      --gold: #d9992b;
      --ink: #1d2733;
      --line: #dbe3ea;
      --bg: #f4f7fa;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.5;
      font-size: 1.0625rem;
    }
    a { color: var(--navy-2); }
    .wrap { width: 100%; max-width: 64rem; margin: 0 auto; padding: 0 1.25rem; }
    header.hero {
      background: linear-gradient(135deg, var(--navy), var(--navy-2));
      color: #fff;
      padding: 2rem 0 1.75rem;
    }
    .eyebrow { margin: 0 0 0.45rem; }
    .eyebrow a { color: var(--gold); font-weight: 600; }
    h1 {
      margin: 0;
      font-size: clamp(1.6rem, 4.5vw, 2.2rem);
      letter-spacing: -0.03em;
      line-height: 1.2;
    }
    main { padding: 1.5rem 0 2.5rem; }
    .pair { display: grid; gap: 1.25rem; }
    @media (min-width: 800px) {
      .pair { grid-template-columns: 1fr 1fr; align-items: start; }
    }
    .card {
      background: #fff;
      border: 1px solid var(--line);
      border-top: 4px solid var(--gold);
      border-radius: 12px;
      padding: 1rem;
    }
    h2 { margin: 0 0 0.75rem; font-size: 1.2rem; color: var(--navy); }
    .flyer {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fff;
    }
    .actions { margin: 0.85rem 0 0; }
    .actions a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 2.75rem;
      padding: 0.4rem 0.9rem;
      border: 1px solid var(--navy-2);
      border-radius: 999px;
      background: #fff;
      color: var(--navy);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
    }
    .actions a:hover,
    .actions a:focus-visible {
      background: var(--navy);
      color: #fff;
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }
    footer {
      background: var(--navy);
      color: #d6e4ef;
      padding: 1.25rem 0 1.5rem;
      font-size: 0.95rem;
    }
    footer a { color: var(--gold); }
  </style>
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <p class="eyebrow"><a href="../">Listing Flyers for Deborah Stepanek</a></p>
      <h1>1027 Emerald Dove Avenue, College Station TX</h1>
    </div>
  </header>
  <main class="wrap">
    <div class="pair">
      <section class="card">
        <h2>Portrait</h2>
        <img class="flyer" src="cs-emerald-dove_portrait_1080x1350.png" width="1080" height="1350" alt="Portrait listing flyer for 1027 Emerald Dove Avenue, College Station TX" />
        <p class="actions"><a href="cs-emerald-dove_portrait_1080x1350.png" download="cs-emerald-dove_portrait_1080x1350.png">Download portrait (1080×1350)</a></p>
      </section>
      <section class="card">
        <h2>Square</h2>
        <img class="flyer" src="cs-emerald-dove_square_1080x1080.png" width="1080" height="1080" alt="Square listing flyer for 1027 Emerald Dove Avenue, College Station TX" />
        <p class="actions"><a href="cs-emerald-dove_square_1080x1080.png" download="cs-emerald-dove_square_1080x1080.png">Download square (1080×1080)</a></p>
      </section>
    </div>
  </main>
  <footer>
    <div class="wrap">
      James Barnes, Senior Loan Officer, Nexa Lending, NMLS 215987, <a href="tel:+15122288124">(512) 228-8124</a>
    </div>
  </footer>
</body>
</html>
